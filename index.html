<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English Library">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>My Little English Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <a href="#home" class="brand" aria-label="Home">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 7h8a3 3 0 0 1 3 3v15a2.5 2.5 0 0 0-2.5-2.5H6z"/><path d="M26 7h-8a3 3 0 0 0-3 3v15a2.5 2.5 0 0 1 2.5-2.5H26z"/></svg>
      </span>
      <span class="brand-name">My Little English Library</span>
    </a>
    <nav class="nav">
      <a href="#home" data-nav="home">Shelves</a>
      <a href="#library" data-nav="library">My Records</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <!-- Audio player (reader only) -->
  <div class="player" id="player" hidden>
    <div class="player-inner">
      <button class="pbtn" id="pPrev" aria-label="이전 문장"><svg viewBox="0 0 24 24"><path d="M7 6v12M18 6l-8 6 8 6z"/></svg></button>
      <button class="pbtn pmain" id="pPlay" aria-label="재생"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
      <button class="pbtn" id="pNext" aria-label="다음 문장"><svg viewBox="0 0 24 24"><path d="M17 6v12M6 6l8 6-8 6z"/></svg></button>
      <div class="pinfo">
        <div class="plabel" id="pLabel">문장을 눌러 들어 보세요</div>
        <div class="pbar"><span id="pBar"></span></div>
      </div>
      <button class="pchip" id="pAuto" aria-pressed="false" title="이어 듣기">이어 듣기</button>
      <button class="pchip" id="pRate" title="속도">1.0×</button>
      <button class="pbtn" id="pSettings" aria-label="설정"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </div>

  <!-- Settings sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-label="Reading settings">
    <div class="sheet-head">
      <h3>Reading Settings</h3>
      <button class="icon-btn" id="sheetClose" aria-label="닫기">✕</button>
    </div>
    <label class="field">
      <span>목소리 (Voice)</span>
      <select id="voiceSelect"></select>
      <small id="voiceHint">기기에 설치된 영어 음성 중 가장 자연스러운 목소리를 자동으로 골라요.</small>
    </label>
    <label class="field">
      <span>읽기 속도 <b id="rateVal">1.0×</b></span>
      <input type="range" id="rateRange" min="0.6" max="1.3" step="0.05" value="1">
    </label>
    <label class="field">
      <span>글자 크기 <b id="fontVal">20px</b></span>
      <input type="range" id="fontRange" min="16" max="26" step="1" value="20">
    </label>
    <label class="switch">
      <input type="checkbox" id="showAllKo">
      <span>모든 해석 펼쳐 보기</span>
    </label>
    <button class="btn ghost" id="testVoice">🔊 목소리 미리 듣기</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ===== Data =====
       새 소설 추가 방법: data/stories/ 에 파일 하나를 만들고 아래에 script 한 줄만 추가하면 끝.
       (형식은 data/stories/_TEMPLATE.js 참고) -->
  <script src="data/library.js"></script>
  <script src="data/stories/daily-lemon-tree.js"></script>
  <script src="data/stories/romance-notes.js"></script>
  <script src="data/stories/adventure-lighthouse.js"></script>
  <script src="data/stories/fantasy-clockmaker.js"></script>
  <script src="data/stories/mystery-umbrella.js"></script>
  <script src="data/stories/business-coffee-cart.js"></script>
  <script src="data/stories/business-recall.js"></script>
  <script src="data/stories/history-28-letters.js"></script>
  <script src="data/stories/psychology-envelope.js"></script>
  <script src="data/stories/science-optimizer.js"></script>
  <script src="data/stories/society-last-speaker.js"></script>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
